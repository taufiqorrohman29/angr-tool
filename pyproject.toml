[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angr-tool"
version = "0.2.0"
description = "CLI Binary Analysis & Decompiler powered by angr"
authors = [{ name = "nakamura" }]
requires-python = ">=3.9"
dependencies = [
    "angr",
    "click>=8.0",
]

[project.optional-dependencies]
full = [
    "networkx",
    "pydot",
    "keystone-engine",
]

[project.scripts]
angr-tool = "angr_tool.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["angr_tool*"]
